<p>
${i+1}. ${s.t}
</p>
`;

s.o.forEach((opt,j)=>{

let huruf = String.fromCharCode(65+j);

html += `
<input type="radio" name="q${i}" id="q${i}${huruf}" value="${huruf}">
<label class="pilihan" for="q${i}${huruf}">
${huruf}. ${opt}
</label>
`;

});

html += `</div>`;

function koreksi(){

let nama = document.getElementById("nama").value;

if(nama==""){
alert("Nama wajib diisi!");
return;
}

let skor = 0;
let salah = [];

let levelBenar = {
C1:0,
C2:0,
C3:0,
C4:0,
C5:0,
C6:0
};

soal.forEach((s,i)=>{

let pilih = document.querySelector(`input[name="q${i}"]:checked`);

if(pilih){

if(pilih.value==s.a){

skor++;

levelBenar[s.level]++;

}else{

salah.push(`Soal ${i+1} (Jawaban benar: ${s.a})`);

}

}else{

salah.push(`Soal ${i+1} belum dijawab (Jawaban benar: ${s.a})`);

}

});

let levelDominan = Object.keys(levelBenar).reduce((a,b)=>
levelBenar[a] > levelBenar[b] ? a : b
);

// KIRIM KE SPREADSHEET

method:"POST",
body:JSON.stringify({
nama:nama,
nilai:skor,
level:levelDominan
})
});

<h2>Hasil Ujian</h2>

<p><b>Nilai:</b> ${skor} / ${soal.length}</p>

<p><b>Level Kognitif Dominan:</b> ${levelDominan}</p>

<div class="salah">
${salah.join("<br>")}
</div>
